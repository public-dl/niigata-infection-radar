name: Generate AI insight and weekly PDF

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "同じ週でもAIコメントを強制再生成する"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: influenza-repository-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages for PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y             fonts-noto-cjk             libpango-1.0-0             libpangoft2-1.0-0             libharfbuzz-subset0             libjpeg-dev             libopenjp2-7-dev             libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade openai weasyprint
          weasyprint --version

      - name: Plan weekly output recovery
        id: output_plan
        run: python scripts/weekly_outputs.py --github-output "$GITHUB_OUTPUT"

      - name: Generate AI weekly insight
        if: steps.output_plan.outputs.generate_ai == 'true' || github.event.inputs.force_regenerate == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          FORCE_AI_COMMENT: ${{ github.event.inputs.force_regenerate || 'false' }}
        run: python scripts/generate_ai_comment.py

      - name: Commit AI before PDF generation
        if: steps.output_plan.outputs.generate_ai == 'true' || github.event.inputs.force_regenerate == 'true'
        run: |
          python scripts/weekly_outputs.py --require-ai
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_comment.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AI weekly influenza insight"
            git push
          fi

      - name: Generate A4 landscape PDF
        if: steps.output_plan.outputs.generate_pdf == 'true' || github.event.inputs.force_regenerate == 'true'
        run: python scripts/generate_weekly_report.py

      - name: Verify weekly outputs
        run: python scripts/weekly_outputs.py --require-current

      - name: Commit PDF and metadata
        if: steps.output_plan.outputs.generate_pdf == 'true' || github.event.inputs.force_regenerate == 'true'
        run: |
          git add reports/latest.pdf reports/latest.meta.json reports/niigata_influenza_report_*.pdf
          if git diff --cached --quiet; then
            echo "No weekly output changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update weekly influenza PDF and metadata"
          git push
