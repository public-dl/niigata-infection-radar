name: Generate AI insight and weekly PDF

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai playwright

      - name: Install Chromium and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m playwright install --with-deps chromium

      - name: Generate AI weekly insight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python scripts/generate_ai_comment.py

      - name: Generate A4 landscape PDF
        run: python scripts/generate_weekly_report.py

      - name: Commit AI JSON and PDF
        run: |
          git add data/ai_comment.json reports/latest.pdf reports/niigata_influenza_report_*.pdf

          if git diff --cached --quiet; then
            echo "No weekly output changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update AI insight and weekly influenza report"
          git push
