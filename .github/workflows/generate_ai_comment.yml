name: Generate AI weekly insight

on:
  # Keep manual execution available for recovery/testing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: pip install --upgrade openai

      - name: Generate AI weekly insight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python scripts/generate_ai_comment.py

      - name: Commit generated comment
        run: |
          if git diff --quiet -- data/ai_comment.json; then
            echo "No AI comment changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_comment.json
          git commit -m "Update AI weekly influenza insight"
          git push
