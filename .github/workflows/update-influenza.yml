name: Update influenza data

on:
  workflow_dispatch:

  # 新潟県の更新は木曜が基本。
  # 祝日・連休などによる遅延も拾えるよう、月〜金で追跡する。
  # cron は UTC。
  schedule:
    # 木曜・金曜：日本時間 12:17 / 15:17 / 18:17
    - cron: "17 3,6,9 * * 4,5"
    # 月曜〜水曜：日本時間 18:17
    - cron: "17 9 * * 1-3"

permissions:
  contents: write

concurrency:
  group: influenza-repository-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages for PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y             fonts-noto-cjk             libpango-1.0-0             libpangoft2-1.0-0             libharfbuzz-subset0             libjpeg-dev             libopenjp2-7-dev             libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade openai weasyprint
          weasyprint --version

      - name: Diagnose latest published week
        run: |
          python - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from common import discover_week_pages

          pages = discover_week_pages(2025)
          latest = max(pages, key=lambda p: (p.year, p.week))
          print("Prefecture latest:", latest.year, latest.week, latest.url)

          p = Path("data/influenza_history.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          weeks = data.get("weeks", [])
          stored = max(
              weeks,
              key=lambda w: (int(w.get("year",0)), int(w.get("week",0)))
          )
          print(
              "Stored latest:",
              stored.get("year"),
              stored.get("week"),
              stored.get("prefecture")
          )
          PY

      - name: Update latest weekly data
        id: update_data
        run: |
          python scripts/update.py

          if git diff --quiet -- data/influenza_history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No influenza data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Influenza data changed."
          fi

      - name: Commit and push data first
        if: steps.update_data.outputs.changed == 'true'
        run: |
          git config user.name "niigata-infection-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/influenza_history.json
          git commit -m "Update influenza weekly data"
          git push

      - name: Plan weekly output recovery
        id: output_plan
        env:
          DATA_CHANGED: ${{ steps.update_data.outputs.changed }}
        run: python scripts/weekly_outputs.py --data-changed "$DATA_CHANGED" --github-output "$GITHUB_OUTPUT"

      - name: Generate AI weekly insight
        if: steps.output_plan.outputs.generate_ai == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python scripts/generate_ai_comment.py

      - name: Commit AI before PDF generation
        if: steps.output_plan.outputs.generate_ai == 'true'
        run: |
          python scripts/weekly_outputs.py --require-ai
          git config user.name "niigata-infection-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ai_comment.json
          if ! git diff --cached --quiet; then
            git commit -m "Update influenza AI insight"
            git push
          fi

      - name: Check production history
        if: steps.output_plan.outputs.generate_pdf == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/influenza_history.json")
          if not p.exists():
              raise SystemExit("ERROR: data/influenza_history.json がありません。")

          data = json.loads(p.read_text(encoding="utf-8"))
          weeks = data.get("weeks", [])
          print(f"history weeks: {len(weeks)}")

          if len(weeks) < 20:
              raise SystemExit(
                  "ERROR: 過去データが20週未満です。PDF生成を停止します。"
              )

          latest = max(
              weeks,
              key=lambda w: (int(w.get("year", 0)), int(w.get("week", 0)))
          )
          print(
              "latest:",
              latest.get("year"),
              latest.get("week"),
              latest.get("prefecture")
          )
          PY

      - name: Generate weekly PDF
        if: steps.output_plan.outputs.generate_pdf == 'true'
        run: python scripts/generate_weekly_report.py

      - name: Verify weekly outputs
        run: python scripts/weekly_outputs.py --require-current

      - name: Commit PDF and metadata
        if: steps.output_plan.outputs.generate_pdf == 'true'
        run: |
          git config user.name "niigata-infection-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/latest.pdf reports/latest.meta.json reports/niigata_influenza_report_*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Update influenza weekly PDF and metadata"
            git push
          fi
