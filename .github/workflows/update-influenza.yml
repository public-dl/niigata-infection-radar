name: Update influenza data

on:
  workflow_dispatch:
  schedule:
    # Thursday 19:30 JST = 10:30 UTC
    - cron: "30 10 * * 4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Update latest weekly data
        run: python scripts/update.py
      - name: Commit when changed
        run: |
          git config user.name "niigata-infection-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/influenza_history.json
          git diff --cached --quiet || git commit -m "Update influenza weekly data"
          git push
