name: Update influenza data

on:
  workflow_dispatch:
  schedule:
    # Thursday 19:30 JST = 10:30 UTC
    - cron: "30 10 * * 4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages for PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-cjk \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz-subset0 \
            libjpeg-dev \
            libopenjp2-7-dev \
            libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade openai weasyprint

      - name: Update latest weekly data
        run: python scripts/update.py

      - name: Generate AI weekly insight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python scripts/generate_ai_comment.py

      - name: Check production history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/influenza_history.json")
          if not p.exists():
              raise SystemExit("ERROR: data/influenza_history.json がありません。")

          data = json.loads(p.read_text(encoding="utf-8"))
          weeks = data.get("weeks", [])

          print(f"history weeks: {len(weeks)}")

          if len(weeks) < 20:
              raise SystemExit(
                  "ERROR: 過去データが20週未満です。PDF生成を停止します。"
              )

          latest = max(
              weeks,
              key=lambda w: (int(w.get("year", 0)), int(w.get("week", 0)))
          )

          print(
              "latest:",
              latest.get("year"),
              latest.get("week"),
              latest.get("prefecture")
          )
          PY

      - name: Generate weekly PDF
        run: python scripts/generate_weekly_report.py

      - name: Verify PDF
        run: |
          test -s reports/latest.pdf
          ls -lh reports/latest.pdf

      - name: Commit all weekly updates
        run: |
          git config user.name "niigata-infection-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/influenza_history.json \
            data/ai_comment.json \
            reports/latest.pdf

          if git diff --cached --quiet; then
            echo "No weekly changes."
            exit 0
          fi

          git commit -m "Update influenza data, AI insight and weekly PDF"
          git push
