name: Backfill influenza history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backfill from 2025
        run: python scripts/backfill.py --start-year 2025
      - name: Commit history
        run: |
          git config user.name "niigata-infection-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/influenza_history.json data/backfill_failures.json
          git diff --cached --quiet || git commit -m "Backfill influenza history"
          git push
