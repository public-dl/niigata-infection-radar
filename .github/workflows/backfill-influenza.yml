name: Backfill influenza history

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: influenza-repository-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backfill from 2025
        run: python scripts/backfill.py --start-year 2025
      - name: Verify influenza history
        run: python scripts/verify_history.py
      - name: Commit history
        run: |
          git config user.name "niigata-infection-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/influenza_history.json data/backfill_failures.json
          git diff --cached --quiet || git commit -m "Backfill verified influenza history"
          git push
