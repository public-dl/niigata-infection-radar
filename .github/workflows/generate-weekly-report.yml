name: Generate weekly influenza report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-cjk \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz-subset0 \
            libjpeg-dev \
            libopenjp2-7-dev \
            libffi-dev

      - name: Install WeasyPrint
        run: |
          python -m pip install --upgrade pip
          pip install weasyprint

      - name: Check production history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/influenza_history.json")
          if not p.exists():
              raise SystemExit("ERROR: data/influenza_history.json がありません。")

          data = json.loads(p.read_text(encoding="utf-8"))
          weeks = data.get("weeks", [])

          print(f"history weeks: {len(weeks)}")

          if len(weeks) < 20:
              raise SystemExit(
                  "ERROR: 過去データが20週未満です。PDF生成を停止します。"
              )

          latest = max(
              weeks,
              key=lambda w: (int(w.get("year", 0)), int(w.get("week", 0)))
          )

          print(
              "latest:",
              latest.get("year"),
              latest.get("week"),
              latest.get("prefecture")
          )
          PY

      - name: Generate PDF
        run: python scripts/generate_weekly_report.py

      - name: Verify PDF
        run: |
          test -s reports/latest.pdf
          ls -lh reports/latest.pdf

      - name: Commit generated PDF
        run: |
          if git diff --quiet -- reports/latest.pdf; then
            echo "No PDF changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/latest.pdf
          git commit -m "Update weekly influenza report"
          git push
