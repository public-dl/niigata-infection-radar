<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせ | インフルエンザレーダー（新潟県）</title>
  <meta name="description" content="インフルエンザレーダー（新潟県）へのお問い合わせ、取材、データ・画面利用、講演等のご連絡はこちら。">
  <link rel="stylesheet" href="./contact.css?v=54">
  <script defer src="./analytics.js?v=54"></script>
</head>
<body class="contact-page">
  <main class="contact-shell">
    <div class="contact-topbar">
      <a class="contact-brand" href="./">インフルエンザレーダー（新潟県）</a>
      <a class="contact-back" href="./">← サイトへ戻る</a>
    </div>

    <section class="contact-card">
      <p class="contact-kicker">CONTACT</p>
      <h1>お問い合わせ</h1>
      <p class="contact-lead">
        インフルエンザレーダー（新潟県）についてのご連絡はこちらからお願いします。
      </p>

      <form name="influenza-radar-contact"
            method="POST"
            action="https://api.web3forms.com/submit">
        <input type="hidden" name="access_key" value="742c2064-6658-4f24-8653-b1c900af3c98">
        <input type="hidden" name="subject" value="新潟インフルエンザレーダーからのお問い合わせ">
        <input type="checkbox" name="botcheck" hidden tabindex="-1" autocomplete="off">

        <div class="contact-grid">
<div class="contact-field full">
            <label for="organization">所属・団体名</label>
            <input id="organization" name="organization" type="text" autocomplete="organization">
          </div>

          <div class="contact-field">
            <label for="name">お名前<span class="required">必須</span></label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>

          <div class="contact-field">
            <label for="email">メールアドレス<span class="required">必須</span></label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="contact-field full">
            <label for="message">お問い合わせ内容<span class="required">必須</span></label>
            <textarea id="message" name="message" required
              placeholder="お問い合わせ内容をご記入ください。"></textarea>
          </div>
        </div>

        <p class="contact-note">
          医療相談・診断に関する個別のご相談には対応していません。
          また、患者名・病歴などの個人情報や機微な医療情報は送信しないでください。
        </p>

        <label class="contact-consent">
          <input type="checkbox" name="privacy_agree" value="yes" required>
          <span>入力した情報が、お問い合わせへの回答・連絡のために利用されることに同意します。</span>
        </label>

        <button class="contact-submit" type="submit">送信する</button>
        <p id="contact-result" class="contact-note" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <p class="contact-footer">Powered by CivITech</p>
  </main>
<script>
(() => {
  const form = document.forms['influenza-radar-contact'];
  const button = form.querySelector('button[type="submit"]');
  const result = document.getElementById('contact-result');
  let submitting = false;

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (submitting || !form.reportValidity()) return;
    result.hidden = false;
    if (form.elements.botcheck.checked) {
      result.textContent = '送信できませんでした。入力内容を確認してください。';
      return;
    }
    const body = JSON.stringify(Object.fromEntries(new FormData(form)));
    submitting = true;
    button.disabled = true;
    button.textContent = '送信中…';
    result.textContent = '送信しています。しばらくお待ちください。';
    form.setAttribute('aria-busy', 'true');
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);
    try {
      const response = await fetch(form.action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body,
        signal: controller.signal
      });
      const data = await response.json();
      if (!response.ok || data.success !== true) throw new Error('Submission failed');
      form.reset();
      result.textContent = 'お問い合わせを送信しました。ありがとうございました。';
    } catch (error) {
      result.textContent = '送信を確認できませんでした。入力内容は保持しています。時間をおいて再度お試しください。';
    } finally {
      clearTimeout(timeout);
      submitting = false;
      button.disabled = false;
      button.textContent = '送信する';
      form.removeAttribute('aria-busy');
    }
  });
})();
</script>
</body>
</html>
